<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
</head>
<body>

<h2>LISTA DE CLIENTES</h2>

<table border="1" cellpadding="5">
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Email</th>
    </tr>

    {% if not clientes %}
        <tr>
            <td colspan="4">Não há clientes cadastrados.</td>
        </tr>
    {% else %}
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente[0] }}</td>
            <td>{{ cliente[1] }}</td>
            <td>{{ cliente[2] }}</td>
            <td>{{ cliente[3] }}</td>
        </tr>
        {% endfor %}
    {% endif %}
</table>

<br>
<a href="/">Voltar</a>

</body>
</html>
