<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Novo Cliente</title>
    
</head>
<body>

<h2>Novo Cliente</h2>

<form method="POST">

    <label>Nome:</label><br>
    <input type="text" name="nome" required><br><br>

    <label>Idade:</label><br>
    <input type="number" name="idade"><br><br>

    <label>CPF:</label><br>
    <input type="text" name="cpf"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br><br>

    <label>Endereço:</label><br>
    <input type="text" name="endereco"><br><br>

    <label>Localidade:</label><br>
    <input type="text" name="localidade"><br><br>

    <label>Data de nascimento:</label><br>
    <input type="date" name="data_nascimento"><br><br>

    <label>Status:</label><br>
    <input type="text" name="status"><br><br>

    <hr>

    <h3>Telefones</h3>

    <!-- TELEFONE 1 -->
    <input type="text" name="telefone_numero[]" placeholder="Número do telefone">
    <input type="text" name="telefone_tipo[]" placeholder="Tipo (Celular, Casa)">
    <br><br>

    <!-- TELEFONE 2 (opcional) -->
    <input type="text" name="telefone_numero[]" placeholder="Número do telefone">
    <input type="text" name="telefone_tipo[]" placeholder="Tipo">
    <br><br>

    <button type="submit">Salvar</button>

</form>

<br>
<a href="{{ url_for('listar_clientes') }}">Voltar</a>

</body>
</html>
